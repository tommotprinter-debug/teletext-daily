name: Update Teletext Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

concurrency:
  group: teletext-daily-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate RSS + AI daily edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
        run: node update-news.mjs

      - name: Validate edition
        run: node test-pack.mjs --github

      - name: Commit updated news
        run: |
          git config user.name "teletext-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news.json change to commit."
          else
            git commit -m "Update Teletext Daily AI edition"
            git push
          fi
